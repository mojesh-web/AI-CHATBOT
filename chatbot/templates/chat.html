<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chatbot</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      background: #f4f6f8;
    }
    h1 {
      text-align: center;
      color: #333;
    }
    #chat-box {
      background: white;
      border-radius: 8px;
      padding: 16px;
      height: 400px;
      overflow-y: auto;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      margin-bottom: 12px;
    }
    .msg { margin: 8px 0; padding: 8px 12px; border-radius: 12px; max-width: 80%; }
    .you { background: #d1e7ff; margin-left: auto; text-align: right; }
    .bot { background: #e6e6e6; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 10px;
      border-radius: 6px;
      border: 1px solid #ccc;
    }
    button {
      padding: 10px 16px;
      border: none;
      border-radius: 6px;
      background: #007bff;
      color: white;
      cursor: pointer;
    }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>🤖 Chatbot</h1>

  <div id="chat-box">
    {% for sender, text in chat_history %}
      <div class="msg {{ 'you' if sender == 'You' else 'bot' }}">
        <strong>{{ sender }}:</strong> {{ text }}
      </div>
    {% endfor %}
  </div>

  <form method="POST" action="/">
    <input type="text" name="message" placeholder="Type a message..." autofocus autocomplete="off">
    <button type="submit">Send</button>
  </form>

  <script>
    // auto-scroll to the bottom of the chat box on load
    const box = document.getElementById("chat-box");
    box.scrollTop = box.scrollHeight;
  </script>
</body>
</html>
